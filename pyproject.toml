[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrim_journal"
version = "0.1.0"
description = "Skyrim save (.ess) parser and journal tool"
requires-python = ">=3.11"
dependencies = ["lz4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
skyrim-journal = "skyrim_journal.cli:main"

[tool.setuptools.packages.find]
include = ["skyrim_journal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
